<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar and Card Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>My Portfolio</h2>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1>Welcome to My Portfolio</h1>
        <p>Exploring Web Development and CSS Positioning</p>
    </section>

    <section class="projects" id="projects">

        <h2>My Projects</h2>

        <div class="card-container">

            <div class="card">
                <img src="https://picsum.photos/id/180/600/400"
                     alt="Web Development">
                <div class="overlay">
                    <h3>Web Development</h3>
                    <p>HTML and CSS Project</p>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/id/20/600/400"
                     alt="Programming">
                <div class="overlay">
                    <h3>Programming</h3>
                    <p>Software Development</p>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/id/48/600/400"
                     alt="Portfolio">
                <div class="overlay">
                    <h3>Personal Portfolio</h3>
                    <p>Responsive Website</p>
                </div>
            </div>

        </div>

    </section>

    <section class="contact" id="contact">
        <h2>Contact Me</h2>
        <p>Email: arikazukite0@gmail.com</p>
    </section>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>

</body>
</html>
